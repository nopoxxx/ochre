# ochre: Terminess, цвета — из темы ochre (~/.config/ochre/term/alacritty.toml)

[general]
import = ["~/.config/ochre/term/alacritty.toml"]

[font]
size = 13.0
normal = { family = "Terminess Nerd Font Mono" }

[window]
padding = { x = 8, y = 8 }
decorations = "None"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 530
