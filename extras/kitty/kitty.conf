# ochre: Terminess, цвета — из темы ochre (~/.config/ochre/term/kitty.conf)

font_family      Terminess Nerd Font Mono
font_size        13.0

window_padding_width 8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0.53

include ~/.config/ochre/term/kitty.conf
